  <header class="app-header">
    <div class="brand"><img class="brand-logo" src="../assets/logo-cpl-epc15.png" alt="CPL Construtora EPC-15"><div><strong>CPL <span>SUPRIMENTOS</span></strong><small>Solicitações · compras · recebimentos</small></div></div>
    <div class="local-tag">Dados salvos neste navegador</div>
  </header>
  <div class="mobile-nav" id="mobileNav"></div>
  <div class="layout">
    <aside id="nav"><div class="nav-label">Operação</div>
      <button class="nav-btn" data-view="dashboard"><span class="nav-icon">◫</span>Visão gerencial</button>
      <button class="nav-btn" data-view="solicitacoes"><span class="nav-icon">☷</span>Solicitações</button>

      <button class="nav-btn" data-view="almoxarifado"><span class="nav-icon">▣</span>Almoxarifado</button>
      <div class="nav-label">Análise</div>

  <script src="seed.js"></script>
  <script>
  (()=>{
    'use strict';
    const KEY='cpl-suprimentos-v1';
    const STATUSES=['Sem status','Cotando','Aguardando Definição','Compra Não Efetuada','Não Entregue','Aguardando Entrega','Entregue Parcial','Efetuar Troca','Entregue Total','Cancelado'];
    const MONTHS=['Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const NAV=[['dashboard','Visão gerencial'],['solicitacoes','Solicitações'],['kanban','Quadro Kanban'],['recebimentos','Recebimentos'],['almoxarifado','Almoxarifado'],['relatorios','Relatórios'],['dados','Backup e dados']];
    let records;
    try{const stored=JSON.parse(localStorage.getItem(KEY));records=Array.isArray(stored)?stored:structuredClone(window.CPL_SEED)}catch{records=structuredClone(window.CPL_SEED)}
    let view='dashboard',showAll=false,grouping='month';
    let dashboardContext=null, drillIds=null, lastMove=null;
    const f={q:'',month:'',status:'',requester:'',supplier:'',dateFrom:'',dateTo:'',etaFrom:'',etaTo:'',lateOnly:false,noEtaOnly:false,openOnly:false};
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR').trim();
    const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}, known=v=>v!==null&&v!==undefined&&v!=='', rem=x=>known(x.qty)&&known(x.received)?Math.max(0,Number(x.qty)-Number(x.received)):null, displayQty=v=>known(v)?fmt(v):'—', closed=x=>['Entregue Total','Cancelado'].includes(x.status), open=x=>!closed(x), age=x=>x.date?Math.max(0,Math.floor((new Date(today()+'T12:00:00')-new Date(x.date+'T12:00:00'))/86400000)):0;
    const late=x=>open(x)&&!!x.eta&&x.eta<today(), fmt=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2}).format(Number(n)||0), datefmt=s=>{if(!s)return '—';const a=String(s).slice(0,10).split('-');return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:esc(s)};

    function warehouse(){const rows=stockRows(),pending=pendingArrivals();return `<div class="page-head"><div><h1>Almoxarifado</h1><p>Entradas, retiradas e responsáveis · dados salvos neste navegador</p></div><div class="actions"><button class="btn primary" onclick="stockForm('in')">＋ Entrada / chegada</button><button class="btn" onclick="stockForm('out')">− Registrar retirada</button><button class="btn" onclick="stockForm('initial')">Saldo inicial contado</button><button class="btn" onclick="exportStockCSV()">Exportar movimentações CSV</button></div></div>${stockSummary()}<section class="panel"><div class="actions"><label class="field">Buscar material<input class="control" value="${esc(stockQuery)}" oninput="stockSearch(this.value)" id="stock-search"></label><label class="field">Disponibilidade<select class="control" onchange="stockFilterChange(this.value)">${[['all','Todos'],['available','Com saldo'],['low','Estoque mínimo'],['empty','Sem saldo']].map(([v,t])=>`<option value="${v}" ${stockFilter===v?'selected':''}>${t}</option>`).join('')}</select></label></div><div class="stock-grid">${rows.map(m=>`<article class="stock-card"><h3>${esc(m.description)}</h3><p><strong>${fmt(stockBalance(m.id))} ${esc(m.unit)}</strong> disponíveis</p><p class="muted">Mínimo: ${m.minimum===null?'não definido':fmt(m.minimum)+' '+esc(m.unit)} · ${stockLevel(m)==='empty'?'Sem saldo':stockLevel(m)==='low'?'Repor estoque':'Com saldo'}</p><div class="actions"><button class="btn" onclick="stockForm('in','${esc(m.id)}')">Entrada</button><button class="btn" onclick="stockForm('out','${esc(m.id)}')">Retirada</button><button class="btn" onclick="stockMinimum('${esc(m.id)}')">Definir mínimo</button></div></article>`).join('')||'<p class="muted">Nenhum material para esta seleção.</p>'}</div></section>${pending.length?`<section class="panel" style="margin-top:16px"><h2>Chegadas aguardando entrada no estoque (${pending.length})</h2><p class="muted">Recebimentos registrados no sistema. Confirme aqui     function filters(report=false){const matches=norm(f.q).length>=2?searchResults(f.q):[];const suggestionMarkup=norm(f.q).length>=2?`<div class="search-results" id="f-search-results"><div class="search-caption">${matches.length?`Correspondências encontradas${matches.length===8?' · mostrando até 8':''}`:'Nenhum item encontrado'}</div>${matches.length?matches.map(x=>`<div class="search-result" tabindex="0" data-search-id="${esc(x.id)}"><strong>${esc(x.description)}</strong><small>${esc(x.id)} · ${esc(x.month||'Mês não informado')} · ${displayQty(x.qty)} ${esc(x.unit||'')}</small><small><span class="result-status">${esc(x.status||'Sem status')}</span> · ${esc(x.requester||'Solicitante não informado')}${x.supplier?` · ${esc(x.supplier)}`:''}</small></div>`).join(''):'<div class="search-empty">Tente outro trecho do nome, código ou fornecedor.</div>'}</div>`:'';return `<section class="filter-panel"><div class="filter-title"><b>${report?'Parâmetros do relatório':'Filtros'}</b><button class="btn ghost small" onclick="clearFilters()">Limpar filtros</button></div><div class="filters"><div class="search-scope"><input class="control search-box" id="f-q" placeholder="Digite: material, código, fornecedor ou solicitante…" value="${esc(f.q)}">${suggestionMarkup}</div><select class="control" id="f-month">${options(MONTHS,f.month,'Todos os meses')}</select><select class="control" id="f-status">${options(STATUSES,f.status,'Todos os status')}</select><select class="control" id="f-requester">${options(unique('requester'),f.requester,'Todos os solicitantes')}</select><select class="control" id="f-supplier">${options(unique('supplier'),f.supplier,'Todos os fornecedores')}</select></div><div class="filters secondary"><label class="field">Solicitação desde<input class="control" id="f-dateFrom" type="date" value="${f.dateFrom}"></label><label class="field">Solicitação até<input class="control" id="f-dateTo" type="date" value="${f.dateTo}"></label><label class="field">Previsão desde<input c     function attachFilters(){const ids=['q','month','status','requester','supplier','dateFrom','dateTo','etaFrom','etaTo'];for(const id of ids){const el=$('#f-'+id);if(!el)continue;el.oninput=el.onchange=()=>{f[id]=el.value;const pos=el.selectionStart;render();if(id==='q'){const next=$('#f-q');next?.focus();if(pos!==null)next?.setSelectionRange(pos,pos)}}}const results=$('#f-search-results');if(results)results.onclick=e=>{const result=e.target.closest('[data-search-id]');if(result)edit(result.dataset.searchId)};if(results)results.onkeydown=e=>{if(e.key==='Enter'){const result=e.target.closest('[data-search-id]');if(result)edit(result.dataset.searchId)}}}

    function dashboard(items){const total=items.length,delivered=items.filter(x=>x.status==='Entregue Total').length,openCount=items.filter(open).length,overdue=items.filter(late).length,noEta=items.filter(x=>open(x)&&!x.eta&&age(x)>14).length,avg=openCount?fmt(items.filter(open).reduce((a,x)=>a+age(x),0)/openCount):'0';const statuses=STATUSES.map(s=>[s,items.filter(x=>x.status===s).length]).filter(x=>x[1]);const months=MONTHS.map(m=>[m,items.filter(x=>x.month===m).length]);const anomalies=items.filter(x=>known(x.received)&&known(x.qty)&&Number(x.received)>Number(x.qty)).length,missingQty=items.filter(x=>!known(x.qty)).length,missingReceived=items.filter(x=>!known(x.received)).length;return `${pageHead('Visão gerencial',`${records.length} registros na base · ${items.length} após os filtros`)}${filters()}<div class="cards"><button class="metric" onclick="setStatus('')"><span>Solicitações</span><strong>${total}</strong><small>itens no filtro atual</small></button><button class="metric good" onclick="setStatus('Entregue Total')"><span>Entregues totalmente</span><strong>${delivered}</strong><small>status Entregue Total</small></button><button class="metric" onclick="setOpen()"><span>Em aberto</span><strong>${openCount}</strong><small>exclui concluídos e cancelados</small></button><button class="metric alert" onclick="setLate()"><span>Previsão vencida</span><strong>${overdue}</strong><small>pendências em atraso</small></button><button class="metric warn" onclick="setNoEta()"><span>Sem previsão há +14 dias</span><strong>${noEta}</strong><small>pendências sem data registrada</small></button><button class="metric" onclick="setOpen()"><span>Idade média em aberto</span><strong>${avg}d</strong><small>dias desde a solicitação</small></button></div>${stockSummary()}${anomalies?`<div class="note warn" style="margin-bottom:14px">Atenção: ${anomalies} registro(s) exibem quantidade recebida maior que a solicitada na base original. Os valores foram preservados; revise na planilha de origem antes de corrigir.</div>`:''}${missingQty||missingReceived?`<div class="note warn" style="margin-bottom:14px">A base contém campos de quantidade vazios (${missingQty} quantidade(s) solicitada(s), ${missingReceived} quantidade(s) recebida(s)). Eles permanecem vazios; o lançamento de recebimento fica bloqueado nesses itens até conferência.</div>`:''}<div class="grid-2"><section class="panel"><h2>Status dos itens</h2>${statuses.map(([s,c])=>bar(s,c,total)).join('')||'<div class="empty">Sem registros para exibir.</div>'}<div class="note">“Cotando” representa uma etapa de compra e não é contado como recebimento.</div></section><section class="panel"><h2>Solicitações por mês</h2>${months.map(([m,c])=>bar(m,c,total)).join('')}<div class="note">Novembro e dezembro não têm registros importados nesta base.</div></section></div>`}
    function kanban(items){return `${pageHead('Quadro Kanban','Use as setas para mover o cartão entre status. Clique no cartão para editar os dados.')}${filters()}${moveNotice()}<div class="kanban">${STATUSES.map((s,statusIndex)=>{const sub=items.filter(x=>x.status===s);return `<section class="lane"><h3>${esc(s)} <span class="muted">${sub.length}</span></h3>${sub.slice(0,100).map(x=>`<article tabindex="-1" data-card-id="${esc(x.id)}" class="ticket ${lastMove?.id===x.id?'moved-card':''}" onclick="edit('${esc(x.id)}')"><small>${esc(x.id)} · ${esc(x.requester||'Sem solicitante')}</small><strong>${esc(x.description.slice(0,130))}${x.description.length>130?'…':''}</strong><small style="margin-top:7px">Saldo: ${displayQty(rem(x))} ${late(x)?'· ⚠ Em atraso':!x.eta&&open(x)?'· Sem previsão':`· Prev. ${datefmt(x.eta)}`}</small><div class="ticket-actions"><button class="ticket-move" aria-label="Mover para ${esc(STATUSES[Math.max(0,statusIndex-1)])}" title="Mover para o status anterior" onclick="moveCard('${esc(x.id)}',-1,event)" ${statusIndex===0?'disabled':''}>←</button><button class="ticket-move" aria-label="Mover para ${esc(STATUSES[Math.min(STATUSES.length-1,statusIndex+1)])}" title="Mover para o próximo status" onclick="moveCard('${esc(x.id)}',1,event)" ${statusIndex===STATUSES.length-1?'disabled':''}>→</button><span class="ticket-hint">Clique no cartão para editar</span></div></article>`).join('')||'<div class="muted" style="font-size:11px;padding:8px">Sem itens</div>'}${sub.length>100?'<small class="muted">Exibindo os primeiros 100</small>':''}</section>`}).join('')}</div>`}
    function receipts(items){const relevant=items.filter(x=>['Aguardando Entrega','Entregue Parcial','Entregue Total','Não Entregue','Efetuar Troca'].includes(x.status));return `${pageHead('Registro de recebimentos','Acompanhe materiais aguardando entrega e lançamentos parciais ou completos.')}${filters()}<div class="note warn" style="margin-bottom:12px">Itens “Cotando” e “Aguardando Definição” pertencem ao fluxo de compra e não aparecem como recebimentos.</div>${table(relevant,'receive')}`}
    function report(items){const total=items.length,qty=items.reduce((a,x)=>a+(known(x.qty)?Number(x.qty):0),0),got=items.reduce((a,x)=>a+(known(x.received)?Number(x.received):0),0),missingQty=items.filter(x=>!known(x.qty)).length,missingReceived=items.filter(x=>!known(x.received)).length,sub=items.filter(late).length;const groups={day:'Dia da solicitação',month:'Mês',year:'Ano'};const aggregate={};items.forEach(x=>{let key='Data não informada';if(x.date){key=grouping==='year'?x.date.slice(0,4):grouping==='month'?`${x.date.slice(0,7)}`:x.date}aggregate[key]=(aggregate[key]||0)+1});const groupRows=Object.entries(aggregate).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,n])=>`<tr><td>${esc(k)}</td><td>${n}</td></tr>`).join('');return `${pageHead('Relatórios','Filtre a base por período e campos disponíveis; gere uma versão para impressão ou exporte os dados para Excel.')}${filters(true)}<section class="filter-panel no-print" style="margin-top:-7px"><label class="field" style="max-width:280px">Agrupar resultado por<select id="grouping" class="control">${Object.entries(groups).map(([k,v])=>`<option value="${k}" ${grouping===k?'selected':''}>${v}</option>`).join('')}</select></label></section><section class="report-preview" id="printReport"><div class="report-top"><div><h2 style="margin:0">CPL · Relatório de Suprimentos</h2><p class="report-note">Emitido em ${datefmt(today())} · ${total} registro(s)</p></div><div class="actions no-print"><button class="btn" onclick="printReport()">Salvar / imprimir PDF</button><button class="btn primary" onclick="exportExcel()">Exportar Excel</button></div></div><div class="report-summary"><div class="summary-chip">Registros: <b>${total}</b></div><div class="summary-chip">Qtd. solicitada preenchida: <b>${fmt(qty)}</b></div><div class="summary-chip">Qtd. recebida preenchida: <b>${fmt(got)}</b></div><div class="summary-chip">Previsões vencidas: <b>${sub}</b></div></div><p class="report-note">Filtros: ${filterDescription()} · Quantidades em branco não entram nos totais: solicitada ${missingQty}, recebida ${missingReceived}.</p><h3>Resumo por ${groups[grouping].toLocaleLowerCase('pt-BR')}</h3><div class="table-wrap"><table style="min-width:0"><thead><tr><th>${groups[grouping]}</th><th>Registros</th></tr></thead><tbody>${groupRows||'<tr><td colspan="2" class="empty">Sem dados para agrupar.</td></tr>'}</tbody></table></div><h3 style="margin-top:18px">Detalhamento</h3>${table(items,'edit')}</section>`}
    function filterDescription(){const p=[];if(f.q)p.push(`busca “${f.q}”`);if(f.month)p.push(`mês ${f.month}`);if(f.status)p.push(`status ${f.status}`);if(f.requester)p.push(`solicitante ${f.requester}`);if(f.supplier)p.push(`fornecedor ${f.supplier}`);if(f.dateFrom||f.dateTo)p.push(`solicitação ${datefmt(f.dateFrom)} a ${datefmt(f.dateTo)}`);if(f.etaFrom||f.etaTo)p.push(`previsão ${datefmt(f.etaFrom)} a ${datefmt(f.etaTo)}`);return p.length?p.join(' · '):'sem filtros adicionais'}
    function dataPage(){return `${pageHead('Backup e dados','Gerencie cópias locais da base deste navegador.') }<section class="panel" style="max-width:850px"><h2>Armazenamento desta versão</h2><p class="muted" style="font-size:12px;line-height:1.6">Os registros são armazenados no navegador atual. Eles não são sincronizados entre computadores e ainda não existe banco de dados online. O arquivo Excel de origem não é alterado pela aplicação.</p><div class="note warn">Exporte um backup JSON antes de limpar os dados do navegador ou trocar de computador.</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="exportJSON()">Exportar backup JSON</button><button class="btn" onclick="$('#restore').click()">Restaurar backup JSON</button><button class="btn danger" onclick="reset()">Restaurar dados originais</button><input id="restore" type="file" accept="application/json,.json" class="hidden" onchange="restore(event)"></div><hr style="border-color:var(--line);margin:20px 0"><p class="muted" style="font-size:11px">Registros atuais: <b>${records.length}</b> · Registros originais do pacote: <b>${window.CPL_SEED.length}</b></p><button class="btn" onclick="exportExcel()">Exportar base atual para Excel</button></section>`}
    function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#mobileNav').innerHTML=NAV.map(([id,label])=>`<button class="${view===id?'active':''}" onclick="navigate('${id}')">${label}</button>`).join('');const items=selected();let content;if(view==='dashboard')content=dashboard(items);else if(view==='solicitacoes')content=`${pageHead('Solicitações de materiais','Consulte, filtre e edite os itens da base.')}${filters()}${table(items)}`;else if(view==='kanban')content=kanban(items);else if(view==='recebimentos')content=receipts(items);else if(view==='almoxarifado')content=warehouse();else if(view==='relatorios')content=report(items);else content=dataPage();$('#app').innerHTML=(dashboardContext?'<div class="note" style="margin-bottom:14px">Detalhamento do indicador · '+drillIds.length+' registros na seleção original. <button class="btn" onclick="navigate(\'dashboard\')">Voltar à visão gerencial</button></div>':'')+content;attachFilters();const group=$('#grouping');if(group)group.onchange=()=>{grouping=group.value;render()}}
    function resetFilters(){Object.keys(f).forEach(k=>f[k]=false);for(const k of ['q','month','status','requester','supplier','dateFrom','dateTo','etaFrom','etaTo'])f[k]='';showAll=false;render()}
    function navigate(v){if(dashboardContext){Object.assign(f,dashboardContext);dashboardContext=null;drillIds=null}view=v;showAll=false;render()}
    function drill(predicate){dashboardContext={...f};drillIds=selected().filter(predicate).map(x=>x.id);view='solicitacoes';showAll=false;render()}
    function setStatus(s){drill(x=>!s||x.status===s)}
    function resetFlags(){f.lateOnly=false;f.noEtaOnly=false;f.openOnly=false}
    function setLate(){drill(late)}function setNoEta(){drill(x=>open(x)&&!x.eta&&age(x)>14)}function setOpen(){drill(open)}
    function moveNotice(){if(!lastMove)return '';return '<div class="note move-notice" role="status"><strong>'+esc(lastMove.description)+'</strong><br>'+esc(lastMove.from)+' → '+esc(lastMove.to)+' · '+esc(lastMove.id)+(lastMove.undone?' · Movimento desfeito':'')+'<div class="actions" style="margin-top:8px"><button class="btn" onclick="locateMoved()">Localizar cartão</button>'+(!lastMove.undone?'<button class="btn primary" onclick="undoMove()">Desfazer movimento</button>':'')+'</div></div>'}
    function locateMoved(){if(!lastMove)return;const card=[...document.querySelectorAll('[data-card-id]')].find(el=>el.dataset.cardId===lastMove.id);if(card){card.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});card.focus({preventScroll:true})}else{alert('O cartão está fora dos filtros atuais. Limpe os filtros para localizá-lo. O botão Desfazer continua disponível.')}}
    function undoMove(){if(!lastMove||lastMove.undone)return;const x=records.find(r=>r.id===lastMove.id);if(!x||x.status!==lastMove.to||x.events?.at(-1)?.at!==lastMove.at){alert('Este cartão foi alterado depois do movimento. Abra o registro para revisar o status atual.');return}const status=x.status;x.status=lastMove.from;x.events.push({at:new Date().toISOString(),type:'Movimento Kanban desfeito',from:status,to:x.status});if(!save()){x.status=status;x.events.pop();return}lastMove.undone=true;render();locateMoved()}
    function moveCard(id,direction,event){if(event)event.stopPropagation();const x=records.find(r=>r.id===id);if(!x)return;const current=STATUSES.indexOf(x.status),next=current+direction;if(current<0||next<0||next>=STATUSES.length)return;const nextStatus=STATUSES[next];if(nextStatus==='Entregue Parcial'&&(!known(x.qty)||!known(x.received)||Number(x.received)<=0||Number(x.received)>=Number(x.qty))){alert('Para mover para “Entregue Parcial”, informe quantidades válidas com recebido maior que zero e menor que o solicitado.');return}if(nextStatus==='Entregue Total'&&(!known(x.qty)||!known(x.received)||Number(x.received)<Number(x.qty))){alert('Só é possível mover para “Entregue Total” quando a quantidade recebida alcançar a quantidade solicitada.');return}if(nextStatus==='Cancelado'&&!confirm('Mover este item para “Cancelado”?'))return;const previous=x.status;const moveAt=new Date().toISOString();x.status=nextStatus;x.events||=[];x.events.push({at:moveAt,type:'Alteração de status pelo Kanban',from:previous,to:nextStatus});if(!save()){x.status=previous;x.events.pop();return}lastMove={id:x.id,description:x.description,from:previous,to:nextStatus,at:moveAt,undone:false};render();locateMoved()}
    function modal(content){$('#modalroot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}function closeModal(){$('#modalroot').innerHTML=''}const val=k=>document.querySelector(`[name="${k}"]`)?.value||'';
    function inputField(k,label,value='',type='text',wide=''){return `<label class="field ${wide}">${label}<input name="${k}" type="${type}" value="${esc(value)}"></label>`}
    function suggestions(query){const q=norm(query);if(q.length<2)return [];const seen=new Set();return records.filter(x=>norm(x.description).includes(q)&&!seen.has(norm(x.description))).filter(x=>{seen.add(norm(x.description));return true}).slice(0,8)}
    function edit(id){const existing=records.find(r=>r.id===id),x=existing||{month:'Outubro',date:today(),status:'Cotando',qty:'',received:0,events:[]};modal(`<div class="modal-head"><h2>${existing?'Editar solicitação':'Nova solicitação'}</h2><button class="btn ghost" type="button" onclick="closeModal()">Fechar</button></div><form id="editForm"><div class="form-grid"><label class="field wide"><span>Descrição do material</span><div class="suggest-wrap"><input name="description" autocomplete="off" value="${esc(x.description||'')}" placeholder="Digite para ver materiais já cadastrados"><div id="suggestions" class="suggestions hidden"></div></div></label>${inputField('req','Nº solicitação',x.req)}${inputField('code','Código',x.code)}<label class="field">Mês<select name="month">${options(MONTHS,x.month,'Selecione o mês')}</select></label>${inputField('requester','Solicitante',x.requester)}${inputField('unit','Unidade de medida',x.unit)}${inputField('date','Data da solicitação',x.date,'date')}${inputField('qty','Quantidade solicitada',x.qty,'number')}${inputField('received','Quantidade recebida acumulada',x.received??'','number')}<label class="field">Status<select name="status">${options(STATUSES,x.status,'Selecione o status')}</select></label>${inputField('eta','Previsão de entrega',x.eta,'date')}${inputField('supplier','Fornecedor',x.supplier)}${inputField('freight','Frete',x.freight)}<label class="field wide">Observações<textarea name="notes">${esc(x.notes||'')}</textarea></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button>${existing?`<button type="button" class="btn" onclick="closeModal();receive('${esc(x.id)}')">Registrar recebimento</button>`:''}<button class="btn primary" type="submit">Salvar</button></div></form>`);
      const desc=$('[name="description"]'),box=$('#suggestions');desc.oninput=()=>{const list=suggestions(desc.value);box.innerHTML=list.map(r=>`<div class="suggestion" data-description="${esc(r.description)}" data-unit="${esc(r.unit||'')}"><span>${esc(r.description)}</span><small>${esc(r.unit||'Unidade não informada')}</small></div>`).join('');box.classList.toggle('hidden',!list.length)};box.onclick=e=>{const item=e.target.closest('.suggestion');if(!item)return;desc.value=item.dataset.description;if(!val('unit'))document.querySelector('[name="unit"]').value=item.dataset.unit;box.classList.add('hidden')};document.addEventListener('click',function hide(e){if(!e.target.closest('.suggest-wrap')){box.classList.add('hidden');document.removeEventListener('click',hide)}});
      $('#editForm').onsubmit=e=>{e.preventDefault();const qtyRaw=val('qty'),receivedRaw=val('received'),qty=qtyRaw===''&&existing&&existing.qty==null?null:Number(qtyRaw),received=receivedRaw===''&&existing&&existing.received==null?null:Number(receivedRaw),sameImportedAmounts=existing&&((qty===null&&existing.qty==null)||qty===Number(existing.qty))&&((received===null&&existing.received==null)||received===Number(existing.received));const qtyValid=qty===null?!!(existing&&existing.qty==null):Number.isFinite(qty)&&qty>0,receivedValid=received===null?!!(existing&&existing.received==null):Number.isFinite(received)&&received>=0;if(!val('description').trim()||!qtyValid||!receivedValid||(qty!==null&&received!==null&&received>qty&&!sameImportedAmounts)){alert('Confira a descrição e as quantidades. Campos que vieram vazios da planilha podem permanecer vazios; novas quantidades recebidas não podem superar a quantidade solicitada.');return}const obj=existing||{id:'NOVO-'+Date.now(),events:[]};for(const k of ['description','req','code','month','requester','unit','date','status','eta','supplier','freight','notes'])obj[k]=val(k);obj.qty=qty;obj.received=received;if(qty!==null&&received!==null&&received>=qty&&obj.status!=='Cancelado')obj.status='Entregue Total';else if(received!==null&&received>0&&!['Cancelado','Efetuar Troca'].includes(obj.status))obj.status='Entregue Parcial';obj.events||=[];obj.events.push({at:new Date().toISOString(),type:existing?'Edição':'Cadastro',detail:'Alteração no protótipo local'});if(!existing)records.unshift(obj);if(save()){closeModal();render()}}
    }
    function receive(id){const x=records.find(r=>r.id===id);if(!x||!open(x)){alert('Este item não está aberto para recebimento.');return}if(!known(x.qty)||!known(x.received)){alert('A quantidade solicitada ou recebida está vazia na fonte. Confira a planilha antes de lançar um recebimento para evitar um saldo incorreto.');return}if(rem(x)<=0){alert('Este item não possui saldo disponível para recebimento.');return}modal(`<div class="modal-head"><h2>Registrar recebimento</h2><button class="btn ghost" onclick="closeModal()">Fechar</button></div><p style="font-size:12px;line-height:1.5">${esc(x.description)}</p><div class="note">Solicitado: <b>${displayQty(x.qty)} ${esc(x.unit||'')}</b> · Recebido: <b>${displayQty(x.received)}</b> · Saldo: <b>${displayQty(rem(x))}</b></div><form id="recForm"><div class="form-grid" style="margin-top:13px">${inputField('added','Quantidade recebida agora','', 'number')}${inputField('deliveryDate','Data de recebimento',today(),'date')}<label class="field wide">Observação da entrega<textarea name="recNote"></textarea></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button type="submit" class="btn primary">Confirmar recebimento</button></div></form>`);$('#recForm').onsubmit=e=>{e.preventDefault();const n=Number(val('added'));if(!Number.isFinite(n)||n<=0||n>rem(x)){alert('Informe uma quantidade maior que zero e até o saldo pendente.');return}x.received=Number(x.received)+n;x.status=rem(x)<=0?'Entregue Total':'Entregue Parcial';x.events||=[];x.events.push({at:new Date().toISOString(),type:'Recebimento',date:val('deliveryDate'),qty:n,note:val('recNote')});if(save()){closeModal();render();const arrival=pendingArrivals().find(p=>p.record.id===x.id&&p.event===x.events[x.events.length-1]);if(arrival)stockForm('in','',arrival)}}}
    function download(content,name,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
    function exportStockCSV(){const columns=['Data','Tipo','Material','Unidade','Quantidade','Quem retirou / entregou','Quem atendeu / recebeu','Observação / destino','ID da movimentação','Referência do recebimento'];const safe=v=>{let t=String(v??'');if(/^[\\s]*[=+@-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};const rows=stock.moves.map(m=>{const material=stock.materials.find(x=>x.id===m.materialId);return [m.date,m.type==='out'?'Retirada':m.type==='initial'?'Saldo inicial':'Entrada',material?.description||'',material?.unit||'',String(m.qty).replace('.',','),m.person||'',m.attendant,m.note||'',m.id,m.source||'']});download('\\uFEFF'+[columns,...rows].map(r=>r.map(safe).join(';')).join('\\r\\n'),'CPL-Almoxarifado-movimentacoes-'+today()+'.csv','text/csv;charset=utf-8')}
    function exportJSON(){download(JSON.stringify({version:2,exportedAt:new Date().toISOString(),records,warehouse:stock},null,2),'CPL-Suprimentos-backup.json','application/json')}
    const EXPORT_KEYS=[['ID','id'],['Mês','month'],['Código','code'],['Solicitação','req'],['Data da solicitação','date'],['Solicitante','requester'],['Unidade','unit'],['Descrição','description'],['Qtd. solicitada','qty'],['Qtd. recebida','received'],['Qtd. restante','saldo'],['Status','status'],['Previsão de entrega','eta'],['Fornecedor','supplier'],['Frete','freight'],['Observações','notes']];
    function xmlCell(v,type='String'){return `<Cell><Data ss:Type="${type}">${esc(v)}</Data></Cell>`}function exportExcel(){const items=selected();const xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Suprimentos"><Table><Row>${EXPORT_KEYS.map(([label])=>xmlCell(label)).join('')}</Row>${items.map(x=>`<Row>${EXPORT_KEYS.map(([_,k])=>xmlCell(k==='saldo'?rem(x):x[k]??'',typeof (k==='saldo'?rem(x):x[k])==='number'?'Number':'String')).join('')}</Row>`).join('')}</Table></Worksheet></Workbook>`;download(xml,'CPL-Suprimentos-relatorio.xls','application/vnd.ms-excel')}
    function printReport(){if(view!=='relatorios'){view='relatorios';render()}window.print()}
    function restore(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!Array.isArray(parsed.records)||!parsed.records.every(x=>x&&x.id&&x.description&&(x.qty===null||Number.isFinite(Number(x.qty)))))throw Error('Estrutura inválida');if(parsed.warehouse)validateStock(parsed.warehouse);if(!confirm('Restaurar '+parsed.records.length+' solicitações? '+(parsed.warehouse?'O estoque e o histórico também serão restaurados.':'Este backup antigo não contém estoque; o almoxarifado atual será mantido.')+' Uma cópia anterior será salva neste navegador.'))return;const oldRecords=localStorage.getItem(KEY),oldStock=localStorage.getItem(STOCK_KEY);localStorage.setItem('cpl-backup-before-restore',JSON.stringify({records,warehouse:stock,exportedAt:new Date().toISOString()}));try{localStorage.setItem(KEY,JSON.stringify(parsed.records));if(parsed.warehouse)localStorage.setItem(STOCK_KEY,JSON.stringify(parsed.warehouse))}catch(error){if(oldRecords!==null)localStorage.setItem(KEY,oldRecords);else localStorage.removeItem(KEY);if(oldStock!==null)localStorage.setItem(STOCK_KEY,oldStock);else localStorage.removeItem(STOCK_KEY);throw error}records=parsed.records;if(parsed.warehouse){stock=parsed.warehouse;stockError=''}dashboardContext=null;drillIds=null;render();alert('Backup restaurado.')}catch(err){alert('Não foi possível restaurar: '+err.message)}finally{e.target.value=''}};reader.readAsText(file)}
    function reset(){if(!confirm('Restaurar os dados originais do pacote? As alterações locais serão substituídas. Exporte um backup antes.'))return;records=structuredClone(window.CPL_SEED);if(save())render()}
    document.querySelectorAll('#nav [data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
    window.navigate=navigate;window.edit=edit;window.receive=receive;window.moveCard=moveCard;window.closeModal=closeModal;window.clearFilters=resetFilters;window.setStatus=setStatus;window.setLate=setLate;window.setNoEta=setNoEta;window.setOpen=setOpen;window.exportJSON=exportJSON;window.exportExcel=exportExcel;window.printReport=printReport;window.restore=restore;window.reset=reset;
    Object.assign(window,{openStock,stockForm,stockArrival,stockSearch,stockFilterChange,stockMinimum,undoMove,locateMoved});
    render();
  })();
  </script>
