name: Restore EPC-15 source folders

on:
  push:
    paths:
      - '.restore-source/READY'

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source-only folders when publicly available
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dashboard.epc15.com.br"
          files=(
            "supabase/README.md"
            "supabase/ROADMAP.md"
            "supabase/andaime-shared-history.sql"
            "supabase/migrations/001_bi_publications.sql"
            "supabase/migrations/002_harden_bi_rpc_grants.sql"
            "supabase/migrations/003_coordination_weekly_calendar_and_lock.sql"
            "supabase/migrations/004_harden_coordination_week_rpc_grants.sql"
            "supabase/migrations/005_coordination_excel_only_week_save.sql"
            "supabase/migrations/006_coordination_stage_photos_storage.sql"
            "supabase/migrations/007_coordination_photos_by_phase.sql"
            "supabase/migrations/008_coordination_photo_captions.sql"
            "supabase/migrations/009_coordination_photos_by_unit_phase.sql"
            "supabase/migrations/010_lightweight_coordination_manual_sync.sql"
            "supabase/migrations/011_coordination_draggable_layout.sql"
            "supabase/migrations/20260930180000_optimize_coordination_week_save.sql"
            "supabase/migrations/20261001000100_integration_sources_foundation.sql"
            "tests/coordination-ppt-summary.test.cjs"
            "tests/integration-normalizer.test.cjs"
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            tmp="$(mktemp)"
            code="$(curl -L -sS -o "$tmp" -w '%{http_code}' "$BASE/$path" || true)"
            if [ "$code" = "200" ] && ! head -c 200 "$tmp" | grep -Eiq '<!doctype html|<html'; then
              mv "$tmp" "$path"
              echo "Restored $path"
            else
              rm -f "$tmp"
              echo "Skipped unavailable $path"
            fi
          done
      - name: Clean and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .restore-source
          rm -f .github/workflows/restore-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "restore: add EPC-15 source folders"
          git push origin HEAD:main
